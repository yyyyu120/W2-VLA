run_id: subtask_m2w_libero_implicit_jepa
run_root_dir: results
seed: 42
wandb_entity: null
wandb_project: w2-vla
is_debug: false

framework:
  name: QwenSubtaskM2W_w2

  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2560

  reasoning:
    # Text reasoning branch: supervised only when cot_target is present.
    cot_reasoning_mode: implicit_query
    latent_cot_num_queries: 16
    qwen_action_context_mode: exclude_cot_prompt
    lambda_cot: 0.1
    generate_cot_at_inference: false
    inference_cot_max_new_tokens: 96
    inference_cot_use_cache: true
    inference_empty_cache: false

  vjepa2:
    # Wrist-only latent encoder. Main-view semantics come from Qwen3-VL hidden states.
    hub_repo: facebookresearch/vjepa2:main
    hub_model: vjepa2_1_vit_large_384
    hub_source: github
    # Use 8 real RGB wrist frames. V-JEPA2.1 tubelet_size=2 maps these to
    # 4 latent time slots.
    num_frames: 8
    image_size: 224

  jepa_predictor:
    # JEPA future-latent predictor. Qwen hidden states provide the action tokens.
    prediction_view: wrist
    dropout: 0.0
    use_jepa_loss: true
    lambda_jepa: 0.2

    # 8 RGB frames become 4 latent frames after V-JEPA tubelet encoding.
    jepa_predictor_depth: 4
    jepa_predictor_num_heads: 8
    jepa_predictor_bf16_autocast: true
    jepa_predictor_activation_checkpointing: true

  policy_context:
    # Optional extra context consumed by the action head.
    use_state: false
    # Feed predicted future wrist latents into the action head as compact
    # context tokens instead of appending all dense JEPA tokens.
    wrist_action_context_tokens: 32
    wrist_action_context_heads: 8
    wrist_action_context_layers: 1
    detach_wrist_action_context: true

  action_model:
    action_model_type: DiT-B
    gradient_checkpointing: true
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: null
    action_horizon: 8
    past_action_window_size: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: subtask_m2w_datasets_w2
    data_root_dir: playground/Datasets/W2-VLA-Training-Data/libero
    data_mix: libero_all
    action_type: delta_qpos
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
    # JEPA branch predicts future latent clips from 8-frame clips:
    # current/history: [t-7, ..., t], future target: [t+1, ..., t+8].
    jepa_prediction_view: wrist
    vlm_include_wrist_view: true
    wrist_history_frames: 8
    future_wrist_frames: 8
    future_wrist_k: 8
    subtask_label_dir: playground/Datasets/W2-VLA-CoT/libero
    CoT_prompt: |-
      Your task is: {instruction}
      Using the current main-view and wrist-view images, identify the robot's current manipulation step.
      Output exactly:
      Subtask: ...
      Reasoning: ...
      Wrist: ...
      Do not add extra text.

trainer:
  max_train_steps: 80000
  num_warmup_steps: 5000
  is_resume: false
  pretrained_checkpoint: null
  reload_modules: null
  resume_optimizer_state: true
  train_qwen_vl: true
  save_interval: 10000
  logging_frequency: 100
  repeated_diffusion_steps: 8

  learning_rate:
    base: 2.5e-5
    jepa_predictor: 5.0e-5
    wrist_context_adapter: 5.0e-5
    action_model: 1.0e-4
    vlm: 1.0e-5

  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6

  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
